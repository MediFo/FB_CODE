[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fi-no3-propagation"
version = "0.1.0"
description = "Validates FI maintenance outage propagation to NO3 CNEC parameters in Nordic FB CC"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
regression = ["statsmodels>=0.14", "linearmodels>=6.0"]
entsoe     = ["entsoe-py>=0.6"]
dev        = ["pytest>=7.0", "statsmodels>=0.14", "linearmodels>=6.0", "entsoe-py>=0.6"]

[project.scripts]
fi-no3-analyse = "fi_no3.propagation:main_cli"
fi-no3-dash    = "fi_no3.dashboard:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::RuntimeWarning"]
