[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fi-no3-propagation"
version = "0.1.0"
description = "Validates FI maintenance outage propagation to NO3 CNEC parameters in Nordic FB CC"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# scipy is already a transitive dependency of statsmodels/linearmodels, but
# is listed explicitly since propagation.py imports scipy.stats.chi2 directly
# (event-study pre-trend joint Wald test).
regression = ["statsmodels>=0.14", "linearmodels>=6.0", "scipy>=1.10"]
entsoe     = ["entsoe-py>=0.6"]
# "lightgbm"/"catboost" ITS counterfactual methods in propagation.py -- both
# optional, each falls back to ARIMA if its own library is missing.
gbm        = ["lightgbm>=4.0", "catboost>=1.2"]
dev        = ["pytest>=7.0", "statsmodels>=0.14", "linearmodels>=6.0", "entsoe-py>=0.6", "scipy>=1.10", "lightgbm>=4.0", "catboost>=1.2"]

[project.scripts]
fi-no3-analyse = "fi_no3.propagation:main_cli"
fi-no3-dash    = "fi_no3.dashboard:launch"

[tool.setuptools]
# This directory (the one pyproject.toml lives in) IS the package: it's a
# flat script layout (see CLAUDE.md), not a src/ layout -- there never was a
# src/fi_no3/ directory, so `where = ["src"]` found nothing to package and
# `pip install .` would produce an empty wheel. Mapping "." to the fi_no3
# package name lets `__init__.py`'s existing relative imports (`from
# .propagation import ...`) and the fi-no3-analyse/fi-no3-dash console
# scripts below resolve correctly without duplicating any of the flat
# module files into a separate src/ copy.
package-dir = {"fi_no3" = "."}
packages = ["fi_no3"]

[tool.setuptools.package-data]
fi_no3 = ["*.png", "*.csv"]

[tool.pytest.ini_options]
# test_pipeline.py is flat in this directory too -- there is no tests/
# subfolder, so the previous "tests" testpaths silently discovered zero
# tests when pytest was run with this config.
testpaths = ["."]
filterwarnings = ["ignore::UserWarning", "ignore::RuntimeWarning"]
